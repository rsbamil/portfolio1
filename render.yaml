services:
  - type: web
    name: rohit-portfolio
    runtime: docker
    dockerfilePath: ./Dockerfile.prod
    region: singapore
    plan: free
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production

      - key: NEXT_PUBLIC_APP_URL
        sync: false   # Set this manually in the Render dashboard

      - key: NEXT_PUBLIC_GTM
        sync: false   # Google Tag Manager ID (optional)

      - key: TELEGRAM_BOT_TOKEN
        sync: false   # Your Telegram bot token for contact form

      - key: TELEGRAM_CHAT_ID
        sync: false   # Your Telegram chat ID for contact form

      - key: GMAIL_PASSKEY
        sync: false   # Gmail app password for nodemailer

      - key: EMAIL_ADDRESS
        sync: false   # Your email address for nodemailer

