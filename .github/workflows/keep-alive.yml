name: Keep Portfolio Alive

on:
  # Run every 5 minutes to prevent Render free tier from sleeping
  schedule:
    - cron: "*/5 * * * *"
  # Also allow manual trigger from GitHub Actions tab
  workflow_dispatch:

jobs:
  ping:
    name: Ping Portfolio
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Ping Render Portfolio Service
        run: |
          echo "Pinging portfolio at: ${{ secrets.RENDER_PORTFOLIO_URL }}"
          
          STATUS=$(curl -o /dev/null -s -w "%{http_code}" \
            --max-time 30 \
            --retry 3 \
            --retry-delay 5 \
            "${{ secrets.RENDER_PORTFOLIO_URL }}")
          
          echo "HTTP Status: $STATUS"
          
          if [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 400 ]; then
            echo "✅ Portfolio is alive! (HTTP $STATUS)"
          else
            echo "⚠️ Portfolio returned HTTP $STATUS - it may still be warming up."
            # Don't fail the workflow — the service is likely cold-starting
            exit 0
          fi
